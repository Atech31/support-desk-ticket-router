<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeskPortal Login</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-black: #050508;
            --card-bg: rgba(18, 18, 26, 0.9);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-cyan: #38bdf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Static container */
        .static-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Canvas for Falling Icons */
        #iconRainCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Glassmorphism Login Card */
        .login-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 36px 30px;
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
            text-align: center;
        }

        /* Header Branding */
        .brand-header {
            margin-bottom: 24px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent-cyan);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
        }

        .toggle-password:hover {
            color: var(--accent-cyan);
        }

        input, select {
            width: 100%;
            padding: 10px 38px 10px 36px;
            background: rgba(10, 10, 16, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        select {
            padding-left: 12px;
            cursor: pointer;
        }

        input:focus, select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        /* Form layout styling */
        #loginForm {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #loginForm .form-group {
            width: 100%;
        }

        /* Login Button */
        .btn-glow {
            width: auto;
            padding: 8px 24px;
            background: var(--accent-cyan);
            border: none;
            border-radius: 8px;
            color: #050508;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        .btn-glow:hover {
            background-color: #0284c7;
            transform: translateY(-1px);
        }

        .alert-message {
            padding: 10px;
            border-radius: 8px;
            background-color: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #f87171;
            font-size: 13px;
            margin-bottom: 14px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="static-container">
        <!-- Canvas Background -->
        <canvas id="iconRainCanvas"></canvas>

        <!-- Main Login Card -->
        <div class="login-card">
            <div class="brand-header">
                <p class="brand-subtitle">Support Desk & Ticket Management</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Role Selection -->
                <div class="form-group">
                    <label for="userRole">Login As</label>
                    <select id="userRole" required>
                        <option value="AGENT">Support Agent</option>
                        <option value="MANAGER">Manager / Admin</option>
                        <option value="EMPLOYEE">Standard Employee</option>
                    </select>
                </div>

                <!-- Email Input -->
                <div class="form-group">
                    <label for="email">Work Email</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="name@company.com" required autocomplete="email">
                    </div>
                </div>

                <!-- Password Input -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <!-- Alert Message Container -->
                <div id="loginAlert" class="alert-message" style="display: none;"></div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn" class="btn-glow">
                    <span id="btnText">Login</span>
                </button>
            </form>
        </div>
    </div>

    <!-- External Script -->
    <script src="login_2.js"></script>
</body>
</html>
